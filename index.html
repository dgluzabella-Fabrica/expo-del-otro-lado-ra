<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Del Otro Lado · Sexto Mundo</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,sans-serif}
    a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important;background:transparent!important}
    a-scene canvas{background:transparent!important}
    .mindar-ui-overlay{z-index:4}
    .mindar-ui-loading,.mindar-ui-scanning,.mindar-ui-error{background:transparent!important}
    .mindar-ui-scanning .scanning{opacity:.35}
    #top{position:fixed;z-index:9;top:max(16px,env(safe-area-inset-top));left:12px;right:12px;text-align:center;pointer-events:none;color:#07385c;text-shadow:0 1px 5px #fff;background:rgba(255,255,255,.8);border-radius:18px;padding:9px 12px}
    #top b{font-size:14px;letter-spacing:.08em}
    #top small{display:block;font-size:12px;margin-top:2px}
    #start{position:fixed;z-index:20;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center;box-sizing:border-box}
    #start .panel{max-width:350px}
    #start h1{color:#07385c;font-size:27px}
    #start p{line-height:1.55;color:#36546a}
    button{border:0;background:#f6077b;color:white;padding:15px 23px;border-radius:30px;font-weight:700;font-size:16px;cursor:pointer}
    #status{position:fixed;z-index:9;bottom:max(18px,env(safe-area-inset-bottom));left:15px;right:15px;text-align:center;background:rgba(255,255,255,.86);color:#07385c;padding:10px;border-radius:15px;font-size:13px;pointer-events:none}
  </style>
</head>
<body>
  <div id="start"><div class="panel"><h1>DEL OTRO LADO</h1><p>El sexto mundo siempre estuvo ahí.<br>Enfocá el logo de la Expo para descubrir lo invisible.</p><button id="go">Abrir la cámara ✨</button><p style="font-size:12px">Permití el acceso a la cámara cuando tu teléfono lo solicite.</p></div></div>
  <div id="top"><b>DEL OTRO LADO · SEXTO MUNDO</b><small>Otra manera de mirar</small></div>
  <div id="status">Enfocá el logo impreso para revelar su magia</div>

  <video id="logo-video" src="./animacion_logo.mp4?v=18-blanco" preload="auto" muted playsinline webkit-playsinline loop crossorigin="anonymous" style="display:none"></video>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes; filterMinCF: 0.001; filterBeta: 0.01"
    color-space="sRGB" renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
    <a-assets timeout="20000"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video id="logo-plane" src="#logo-video" width="1" height="1" position="0 0 0.01" material="shader: flat; side: double; transparent: false"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const target = document.getElementById('target');
    const video = document.getElementById('logo-video');
    const status = document.getElementById('status');
    let visible = false;

    target.addEventListener('targetFound', () => {
      visible = true;
      status.textContent = '¡Descubriste lo invisible! ✨';
      video.currentTime = 0;
      const playing = video.play();
      if (playing && typeof playing.catch === 'function') {
        playing.catch(() => { status.textContent = 'Apuntá al logo para activar la animación'; });
      }
    });
    target.addEventListener('targetLost', () => {
      visible = false;
      video.pause();
      status.textContent = 'Enfocá el logo impreso para revelar su magia';
    });

    document.getElementById('go').addEventListener('click', async () => {
      document.getElementById('start').style.display = 'none';
      // En iPhone, habilitamos el video desde el gesto del botón.
      try { await video.play(); video.pause(); video.currentTime = 0; } catch (e) { /* Se intentará de nuevo al reconocer el logo. */ }
      try {
        await scene.systems['mindar-image-system'].start();
      } catch (e) {
        document.getElementById('start').style.display = 'flex';
        alert('No se pudo iniciar la cámara. Abrí el enlace en Safari o Chrome y permití el acceso.');
      }
    });
  </script>
</body>
</html>
