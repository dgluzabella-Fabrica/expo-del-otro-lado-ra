<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Del Otro Lado · Realidad Aumentada</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071e33;font-family:system-ui,sans-serif}a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;display:block!important} .a-canvas{width:100%!important;height:100%!important}#header{position:fixed;z-index:100;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:#082b4ad9;color:white;border-radius:15px;padding:11px 14px;text-align:center;pointer-events:none;font-weight:700}#status{font-weight:400;font-size:13px;margin-top:4px}#start{position:fixed;z-index:101;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:0;border-radius:40px;background:#fa087d;color:white;padding:15px 24px;font-size:16px;font-weight:700;white-space:nowrap}#error{display:none;position:fixed;inset:0;z-index:110;background:#071e33;color:white;padding:40px 20px;text-align:center}
</style></head><body><div id="header">DEL OTRO LADO · Expo 2026<div id="status">Permití la cámara y enfocá el logo completo</div></div><button id="start">Activar animación</button><div id="error">Falta targets.mind en el repositorio. Subilo junto a index.html.</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes" embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-assets><video id="video" src="./animacion_logo.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-video src="#video" width="1" height="1.0708" position="0 0 0.015" material="shader: flat; side: double; transparent: false"></a-video></a-entity></a-scene>
<script>const v=document.getElementById('video'),s=document.getElementById('status'),t=document.getElementById('target');let active=false;document.getElementById('start').addEventListener('click',async()=>{try{await v.play();active=true;s.textContent='Animación lista: enfocá el logo';}catch(e){s.textContent='No se pudo iniciar el video: '+e.name;}});t.addEventListener('targetFound',()=>{s.textContent='¡El arte cobra vida!';if(active)v.play().catch(()=>{});});t.addEventListener('targetLost',()=>{s.textContent='Volvé a enfocar el logo';v.pause()});fetch('./targets.mind',{method:'HEAD'}).then(r=>{if(!r.ok)document.getElementById('error').style.display='block'}).catch(()=>{});</script></body></html>
