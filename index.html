<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Del Otro Lado · Primera experiencia RA</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b2340;color:#fff;font-family:system-ui,Arial}
#banner{position:fixed;z-index:20;top:12px;left:12px;right:12px;background:#09294eea;padding:12px 16px;border-radius:14px;text-align:center;box-shadow:0 3px 20px #0005}
#banner small{display:block;margin-top:4px;color:#d1eced}
#play{position:fixed;z-index:30;bottom:22px;left:50%;transform:translateX(-50%);border:0;border-radius:30px;padding:12px 22px;background:#f50076;color:white;font-weight:700}
#fallback{display:none;position:fixed;z-index:40;inset:0;background:#09294e;padding:40px 22px;text-align:center}
</style>
</head>
<body>
<div id="banner"><strong>DEL OTRO LADO · Expo 2026</strong><small id="status">Permití la cámara y enfocá el logo impreso.</small></div>
<button id="play" type="button">Activar animación</button>
<div id="fallback"><h2>Falta preparar el reconocimiento</h2><p>Descargá el archivo targets.mind desde el compilador de MindAR y colocálo junto a index.html. Consultá INSTRUCCIONES.txt.</p></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes"
 color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true"
 vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
 <a-assets>
  <video id="animacion" src="./animacion_logo.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
 </a-assets>
 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 <a-entity id="objetivo" mindar-image-target="targetIndex: 0">
  <a-video src="#animacion" position="0 0 0.01" width="1" height="1.0708" material="shader: flat; side: double"></a-video>
 </a-entity>
</a-scene>
<script>
const video=document.querySelector("#animacion"), status=document.querySelector("#status");
const target=document.querySelector("#objetivo");
document.querySelector("#play").addEventListener("click",()=>{
 video.play().then(()=>{video.pause();video.currentTime=0;status.textContent="Audio y animación habilitados. Enfocá el logo.";}).catch(()=>{});
});
target.addEventListener("targetFound",()=>{status.textContent="¡El arte cobra vida!";video.play().catch(()=>{status.textContent="Tocá «Activar animación»";});});
target.addEventListener("targetLost",()=>{status.textContent="Volvé a enfocar el logo.";video.pause();});
fetch("./targets.mind",{method:"HEAD"}).then(r=>{if(!r.ok)document.querySelector("#fallback").style.display="block";}).catch(()=>{});
</script>
</body>
</html>
